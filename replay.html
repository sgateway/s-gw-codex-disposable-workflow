<title>s-gw disposable-token terminal replay</title>
<style>body{margin:0;background:#080f1c;color:#dce6f3;font:18px system-ui}main{max-width:1200px;margin:30px auto;padding:25px}h1{font-size:30px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#111827;padding:28px;min-height:350px;font:18px/1.55 ui-monospace,monospace}button,input{font:inherit;margin:8px}small{color:#9eb3cf}</style>
<main><small>TERMINAL REPLAY | ACTUAL CLI OUTPUT | FAKE TOKEN | READING PACE EDITED</small><h1 id="title"></h1><pre id="terminal"></pre><button id="play">Pause</button><input type="range" id="seek" min="0" max="55.99" step="0.1" value="0"><span id="time"></span><p><small>Selected actual output fields. The script performed local CLI approval in an isolated fake store. No live client UI or human-approval recording. <a href="tutorial.md">Try the disposable workflow</a>.</small></p></main>
<script>const cards=[{"seconds": 6, "title": "Try the s-gw approval loop", "text": "SIMULATED CREDENTIAL: demo-token-value\n\nReleased s-gw 0.1.22 CLI, actual results.\nSource: 2026-11-15T07:39:34.037571+00:00\n\nReading pace edited.\nApproval: scripted local CLI command."}, {"seconds": 7, "title": "Use a disposable store", "text": "# Scope used by every recorded s-gw command\nSGW_HOME=\u003crun>/state/home\nSGW_RECOVERY_HOME=\u003crun>/state/recovery\nSGW_SECRET_BACKEND=local\nSGW_DISABLE_KEYCHAIN=1\n\n# A fixed demo-only unlock passphrase stays in process env.\n$ s-gw init\n{\n  \"ok\": true\n}\n\n# State paths abbreviated. Output: selected actual field."}, {"seconds": 8, "title": "Request one local command", "text": "$ s-gw request env-command s-gw:api-token:jW59VLS9848c \\\n    --command /usr/bin/printenv --arg DEMO_TOKEN \\\n    --inject-env DEMO_TOKEN \\\n    --reason \"Codex disposable-token tutorial\"\n\n{\n  \"id\": \"req_pq5SrUleYUXg\",\n  \"handle\": \"s-gw:api-token:jW59VLS9848c\",\n  \"state\": \"pending\"\n}\n\n# Selected actual response fields."}, {"seconds": 7, "title": "Pending execution is refused", "text": "$ s-gw execute req_pq5SrUleYUXg\n\ns-gw error: Request req_pq5SrUleYUXg is pending; local approval is required before\nexecution.\n\n[exit 1]\n\n# This error is the expected first result."}, {"seconds": 7, "title": "Approve locally, for this request", "text": "$ s-gw approve req_pq5SrUleYUXg --mode per-transaction\n\n{\n  \"id\": \"req_pq5SrUleYUXg\",\n  \"state\": \"approved\",\n  \"approvalSource\": \"manual\"\n}\n\n# Selected actual response fields.\n# Scripted demo approval in the isolated fake store.\n# In the tutorial, the person runs this approval step."}, {"seconds": 11, "title": "The returned token is sanitized", "text": "$ s-gw execute req_pq5SrUleYUXg\n\n{\n  \"exitCode\": 0,\n  \"stdout\": \"\u003c\u003cSGW_SECRET:s-gw:api-token:jW59VLS9848c>>\\n\",\n  \"proof\": \"s-gw-proof:req_pq5SrUleYUXg:cWI6KjCqza_7wXxTDyMauMET\",\n  \"sanitized\": true\n}\n\n# Selected actual response fields.\n# printenv receives the fake token; the result has a handle."}, {"seconds": 6, "title": "Approval lasts for one transaction", "text": "$ s-gw execute req_pq5SrUleYUXg\n\ns-gw error: Request req_pq5SrUleYUXg is executed; local approval is required before\nexecution.\n\n# A new identical request returned these actual fields:\n{\n  \"id\": \"req_dHaut_zvg_dc\",\n  \"state\": \"pending\"\n}"}, {"seconds": 4, "title": "Try the disposable workflow", "text": "$ python3 trust_loop.py run\n\nFollow tutorial.md for the Codex handoff version.\n\nSuccessful run verified; disposable state removed.\nHuman first-setup time has not been measured."}];let pos=0,playing=true;const title=document.querySelector('#title'),term=document.querySelector('#terminal'),seek=document.querySelector('#seek'),clock=document.querySelector('#time'),play=document.querySelector('#play');function paint(){let end=0;for(const c of cards){end+=c.seconds;if(pos<end){title.textContent=c.title;term.textContent=c.text;break}}seek.value=pos;clock.textContent=Math.floor(pos)+' / 56s';play.textContent=playing?'Pause':'Play'}play.onclick=()=>{if(pos>=55.99)pos=0;playing=!playing;paint()};seek.oninput=()=>{pos=Number(seek.value);paint()};setInterval(()=>{if(playing){pos=Math.min(55.99,pos+.1);if(pos>=55.99)playing=false;paint()}},100);paint();</script>
